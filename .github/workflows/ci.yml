name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Electron binary مش محتاجينه في الاختبارات — تحميله بيفشل على CI وبيضيّع وقت
      - name: Install
        run: npm install --no-audit --no-fund
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Snippets check
        run: npm run check:snippets

      - name: Packaging config
        run: npm run check:packaging

      - name: Electron syntax
        run: |
          node --check electron/main.cjs
          node --check electron/preload.cjs
          node --check electron/snippets.cjs
          node --check electron/security.cjs
          node --check electron/updates.cjs
          node --check electron/bugreport.cjs

      - name: Build
        run: npm run build
